name: Scrape Devaito

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "custom/devaito_spider.py"
      - ".github/workflows/devaito-scrape.yml"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Scrapling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          scrapling install --force

      - name: Scrape homepage to AI-safe Markdown
        run: |
          mkdir -p scrape-output
          scrapling extract get "https://devaito.com/" "scrape-output/home.md" --ai-targeted --timeout 60

      - name: Crawl internal pages
        run: |
          python custom/devaito_spider.py
          mv devaito-scrape.json scrape-output/devaito-scrape.json

      - name: Upload scrape results
        uses: actions/upload-artifact@v4
        with:
          name: devaito-scrape
          path: scrape-output/
          if-no-files-found: error
          retention-days: 7
